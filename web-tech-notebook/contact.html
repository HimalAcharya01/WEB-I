<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Web Tech Notebook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo"><i class="fa-solid fa-book-open"></i> Web Tech Notebook</a>
      <button class="nav-toggle" aria-label="menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" data-page="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="about.html" data-page="about.html"><i class="fa-solid fa-user"></i> About Us</a></li>
        <li><a href="contact.html" data-page="contact.html"><i class="fa-solid fa-envelope"></i> Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="wrap small">
      <h1>Contact</h1>
      <p class="justify">If you have a question or a suggestion, write it below. You can also email me at <strong>notebook@example.com</strong>.</p>

      <form id="contact-form" novalidate>
        <label for="name">Your name</label>
        <input type="text" id="name" name="name">
        <span class="error" id="name-error"></span>

        <label for="email">Email</label>
        <input type="email" id="email" name="email">
        <span class="error" id="email-error"></span>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5"></textarea>
        <span class="error" id="message-error"></span>

        <button type="submit"><i class="fa-solid fa-paper-plane"></i> Send</button>
        <p id="form-status" role="status"></p>
      </form>
    </div>
  </main>

  <footer>
    <p>Made for the Web Tech I lab &middot; <span id="year">2026</span></p>
  </footer>

</body>
</html>
